name: CI Pipeline

on:
  push:
    branches: [ main, master, "claude/**", "feat/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gq_store_test
          POSTGRES_USER: gq_user
          POSTGRES_PASSWORD: gq_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Prisma Migrations & Seed Test DB
        env:
          DATABASE_URL: postgresql://gq_user:gq_password@localhost:5432/gq_store_test?schema=public
          SESSION_SECRET: test-secret-key-ci
        run: |
          npx prisma db push --skip-generate
          node prisma/seed.js

      - name: Run Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://gq_user:gq_password@localhost:5432/gq_store_test?schema=public
          SESSION_SECRET: test-secret-key-ci
        run: npm test
